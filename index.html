<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glovo Courier Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0c1017; color: #fff; overflow-x: hidden; }
        .map-bg {
            background-color: #0c141e;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }
        .pulse-location {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between relative select-none">

    <!-- MAPA CON PUNTOS DE REFERENCIA (ALCOBENDAS / A-1) -->
    <div class="absolute inset-0 map-bg z-0 flex items-center justify-center overflow-hidden">
        <!-- Zonas del mapa -->
        <div class="absolute top-[18%] left-[20%] text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Soto de Viñuelas</div>
        <div class="absolute bottom-[35%] left-[15%] text-xs font-black text-zinc-400 tracking-wider">Alcobendas</div>
        <div class="absolute top-[40%] right-[10%] text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Belvis del Jarama</div>

        <!-- Carretera A-1 -->
        <div class="absolute w-[2px] h-full bg-zinc-700/50 rotate-45"></div>
        <div class="absolute top-[48%] left-[52%] bg-white text-zinc-950 font-bold text-[9px] px-1 rounded border border-zinc-400 shadow">A-1</div>

        <!-- Pin Cliente (Icono de usuario) -->
        <div class="absolute top-[22%] left-[53%] z-10 flex flex-col items-center">
            <div class="w-9 h-9 bg-[#2dd4bf] text-zinc-950 rounded-full flex items-center justify-center shadow-2xl border-2 border-white">
                <svg class="w-5 h-5 text-zinc-900" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="w-0.5 h-3 bg-[#2dd4bf]"></div>
        </div>

        <!-- Ubicación Repartidor (Punto azul parpadeante con cono de luz) -->
        <div class="absolute top-[46%] left-[45%] z-10">
            <div class="w-7 h-7 bg-blue-500/30 rounded-full flex items-center justify-center pulse-location">
                <div class="w-3.5 h-3.5 bg-blue-500 rounded-full border-2 border-white shadow-xl"></div>
            </div>
        </div>
    </div>

    <!-- CABECERA SUPERIOR (ESTADO EN LÍNEA) -->
    <header class="relative z-20 px-4 pt-3 flex items-center justify-between">
        <!-- Botón Menú 3 rayas -->
        <button onclick="toggleMenu()" class="w-11 h-11 bg-[#18181b]/90 border border-zinc-700/80 rounded-full flex flex-col items-center justify-center gap-1 shadow-lg active:scale-95 transition backdrop-blur-md">
            <span class="w-4 h-0.5 bg-white rounded-full"></span>
            <span class="w-4 h-0.5 bg-white rounded-full"></span>
            <span class="w-4 h-0.5 bg-white rounded-full"></span>
        </button>

        <!-- Pastilla de Estado: En línea -->
        <div onclick="toggleOnlineStatus()" id="statusPill" class="bg-[#18181b]/95 border border-zinc-700/80 px-6 py-2 rounded-2xl shadow-2xl flex items-center gap-2 cursor-pointer backdrop-blur-md active:scale-95 transition">
            <div class="flex flex-col items-center">
                <span class="text-[10px] text-zinc-400 font-semibold tracking-wider uppercase leading-none">Estado</span>
                <span id="statusText" class="text-sm font-extrabold text-white tracking-wide">En línea</span>
            </div>
            <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 ml-1"></div>
        </div>

        <!-- Icono de soporte/auricular -->
        <div class="w-11 h-11 bg-[#18181b]/90 border border-zinc-700/80 rounded-full flex items-center justify-center shadow-lg backdrop-blur-md relative">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-zinc-900"></span>
        </div>
    </header>

    <!-- MENÚ LATERAL DESPLEGABLE -->
    <div id="sideMenu" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden transition-opacity duration-300" onclick="toggleMenu()">
        <div class="absolute left-0 top-0 bottom-0 w-72 bg-[#18181b] border-r border-zinc-800 p-5 flex flex-col justify-between shadow-2xl" onclick="event.stopPropagation()">
            <div>
                <div class="flex items-center gap-3 pb-5 border-b border-zinc-800 mb-5">
                    <div class="w-12 h-12 bg-[#2dd4bf] rounded-full flex items-center justify-center font-black text-zinc-950 text-lg shadow-lg">NR</div>
                    <div>
                        <h3 class="font-bold text-white text-sm">Ronald Romero</h3>
                        <p class="text-xs text-[#2dd4bf] font-medium">⭐ 4.98 · Repartidor Pro</p>
                    </div>
                </div>
                <div class="space-y-2">
                    <a href="#" class="flex items-center gap-3 p-3 rounded-xl bg-zinc-800/60 text-white font-medium text-sm">📊 Estadísticas</a>
                    <a href="#" class="flex items-center gap-3 p-3 rounded-xl hover:bg-zinc-800/50 text-zinc-300 text-sm">📅 Horarios y Zonas</a>
                    <a href="#" class="flex items-center gap-3 p-3 rounded-xl hover:bg-zinc-800/50 text-zinc-300 text-sm">💳 Ganancias y Pagos</a>
                </div>
            </div>
            <button onclick="toggleMenu()" class="w-full py-3 bg-zinc-800 text-zinc-300 rounded-xl font-bold text-xs">Cerrar menú</button>
        </div>
    </div>

    <!-- TARJETA INFERIOR (DETALLES EXACTOS DE LA CAPTURA) -->
    <div class="relative z-25 p-3 pb-4">
        <div class="bg-[#12161f]/95 border border-zinc-800/90 rounded-3xl p-5 shadow-2xl backdrop-blur-xl">
            
            <!-- Barra superior fina de deslizamiento -->
            <div class="w-10 h-1 bg-zinc-600/80 rounded-full mx-auto mb-4"></div>

            <!-- Cabecera del cliente y botones de acción -->
            <div class="flex items-center justify-between mb-3">
                <h1 class="text-2xl font-black text-white tracking-tight">Daniel vila</h1>
                <div class="flex items-center gap-3">
                    <button class="w-11 h-11 bg-zinc-900 border border-emerald-500/40 rounded-full flex items-center justify-center text-emerald-400 shadow-md active:scale-95 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    </button>
                    <button class="w-11 h-11 bg-zinc-900 border border-emerald-500/40 rounded-full flex items-center justify-center text-emerald-400 shadow-md active:scale-95 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Dirección -->
            <p class="text-sm font-semibold text-zinc-200 mb-3">Avenida de Nazaret 4 , 28708, MAD</p>

            <!-- Teléfono y opción Traducir -->
            <div class="flex items-center gap-2 mb-2">
                <span class="text-zinc-400 text-sm">✍️</span>
                <span class="text-sm font-mono font-bold text-emerald-400 underline underline-offset-2">679736128</span>
            </div>
            <div class="text-xs text-zinc-400 mb-2">🥝</div>
            <button class="text-emerald-400 text-sm font-bold mb-5 hover:underline block">Traducir</button>

            <!-- Separador -->
            <div class="border-t border-zinc-800/80 pt-4 mb-2">
                <p class="text-2xl font-black text-white tracking-widest mb-2">101816173019</p>
                
                <div class="flex items-center justify-between mb-4">
                    <span class="text-sm font-bold text-white">#6298 · Daniel vila</span>
                    <span class="bg-emerald-500/10 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-md border border-emerald-500/20">Pick-up</span>
                </div>
            </div>

            <p class="text-xs font-bold text-zinc-400 pt-1">Pago</p>

        </div>
    </div>

    <script>
        let isOnline = true;

        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('hidden');
        }

        function toggleOnlineStatus() {
            isOnline = !isOnline;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (isOnline) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 ml-1";
                text.innerText = "En línea";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-red-500 ml-1";
                text.innerText = "Fuera de línea";
            }
        }
    </script>
</body>
</html>
